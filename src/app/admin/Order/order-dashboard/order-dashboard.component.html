<div class="container-fluid position-relative">
    <!-- Loader -->
    <div *ngIf="loading" class="loader-container">
        <mat-spinner class="position-absolute top-50 start-50 translate-middle"></mat-spinner>
    </div>
  
    <!-- Header -->
    <div class="row">
        <div class="col-12 text-center py-3">
            <h1>Order Dashboard</h1>
        </div>
    </div>
  
    <div class="row justify-content-center">
        <div class="col-lg-10 col-md-12">
            <!-- Search Field -->
            <mat-form-field class="w-100">
                <span matPrefix></span>
                <input type="tel" matInput placeholder="Search" name="search" [(ngModel)]="serchTerm">
                <button matSuffix mat-button >
                    <mat-icon>search</mat-icon>
                </button>
            </mat-form-field>
  
            <!-- Responsive Table -->
            @if(dataSource==null){
                <div class="row">
                        <h2>rocords are not present...</h2>
                </div>
            }@else{
                <div class="table-responsive">
                    <table  mat-table [dataSource]="dataSource" class="w-100">
                        <ng-container matColumnDef="id">
                            <th mat-sort-header="id" mat-header-cell *matHeaderCellDef> id </th>
                            <td mat-cell *matCellDef="let element"> {{element.Id}} </td>
                        </ng-container>
      
                        <ng-container matColumnDef="Status">
                            <th mat-sort-header="Status" mat-header-cell *matHeaderCellDef> Status </th>
                            <td mat-cell *matCellDef="let element"> {{element.Status}} </td>
                        </ng-container>
      
                        <ng-container matColumnDef="TotalBill">
                            <th mat-sort-header="TotalBill" mat-header-cell *matHeaderCellDef> TotalBill </th>
                            <td mat-cell *matCellDef="let element"> {{element.TotalBill}} </td>
                        </ng-container>
      
                        <ng-container matColumnDef="OrderDate">
                            <th mat-header-cell *matHeaderCellDef> OrderDate </th>
                            <td mat-cell *matCellDef="let element">{{element.OrderDate}}</td>
                        </ng-container>
                        <ng-container matColumnDef="OrderStatusChangedDate">
                          <th mat-header-cell *matHeaderCellDef> OrderStatusChangedDate </th>
                          <td mat-cell *matCellDef="let element">{{element.OrderStatusChangedDate}}</td>
                        </ng-container>
      
                        
      
                        <ng-container matColumnDef="action">
                            <th mat-header-cell *matHeaderCellDef> Action </th>
                            <td mat-cell *matCellDef="let element">
                                <button mat-icon-button >
                                    <mat-icon>launch</mat-icon>
                                </button>
                                <button mat-icon-button >
                                    <mat-icon color="warn">delete_outline</mat-icon>
                                </button>
                            </td>
                        </ng-container>
      
                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                    </table>
                </div>
      
                <!-- Paginator -->
                <div class="py-3 d-flex justify-content-center">
                    <!-- <mat-paginator 
                        [length]="totalRecords"
                        [pageSize]="pageSize"
                        [pageIndex]="pageIndex"
                        showFirstLastButtons
                        (page)="handlePageEvent($event)">
                    </mat-paginator> -->
                </div>
            }
            
        </div>
    </div>
  </div>
