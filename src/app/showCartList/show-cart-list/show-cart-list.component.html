<div *ngIf="cartItems.length > 0; else emptyCart" style="display: flex; flex-wrap: wrap; gap: 16px; padding: 10px;">
  <mat-card *ngFor="let item of cartItems" style="width: 240px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); border-radius: 10px; overflow: hidden;">
    
    <!-- Optional: Product Thumbnail -->
    <img *ngIf="getImage(item)" 
         [src]="getImage(item)" 
         alt="{{ item.name }}" 
         style="width: 100%; height: 140px; object-fit: cover; border-bottom: 1px solid #eee;" />

    <!-- Product Details -->
    <mat-card-content style="padding: 10px;">
      <h4 style="margin: 5px 0; font-size: 1rem;">{{ item.name }}</h4>
      <p style="margin: 4px 0; font-size: 0.95rem; font-weight: bold; color: #4CAF50;">₹{{ item.price }}</p>
      <p style="margin: 0; font-size: 0.85rem; color: #777;">{{ item.description }}</p>
    </mat-card-content>
  </mat-card>
</div>

<ng-template #emptyCart>
  <p style="text-align: center; font-size: 1.2rem; color: #888;">Your cart is empty.</p>
</ng-template>
